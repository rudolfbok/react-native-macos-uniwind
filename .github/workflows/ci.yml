name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx react-native bundle --platform macos --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/main.jsbundle"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - run: npm ci
      - run: bundle exec pod install --project-directory=macos
      - run: xcodebuild -workspace macos/App.xcworkspace -scheme App-macOS -configuration Release -destination platform=macOS CODE_SIGNING_ALLOWED=NO build
